schema: spec-driven

context: |
  herdfile: declarative workspaces for herdr (terminal workspace manager for AI coding agents,
  targeting 0.9.x). A repo's `.herdr/services.toml` names commands; a per-workspace file says
  which tabs exist and which panes are in each, left to right. A watcher makes herdr match the
  file and writes the operator's hand changes back. Public, MIT. Writing style: plain words,
  short sentences, herdr's own terms (workspace, tab, pane, worktree).
