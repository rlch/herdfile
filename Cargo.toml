[package]
name = "herdfile"
version = "0.1.3"
edition = "2021"
description = "Declarative workspaces for herdr"
license = "MIT"
repository = "https://github.com/rlch/herdfile"
rust-version = "1.80"

[[bin]]
name = "herdfile"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
